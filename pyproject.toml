[project]
name = "reapr-memoryagent"
version = "1.0.0"
description = "MemoryAgent - Qwen Cloud AI Hackathon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "dashscope>=1.19.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
